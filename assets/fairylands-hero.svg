    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d0f13"/><stop offset="1" stop-color="#102c49"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#348bfa" stop-opacity=".3"/><stop offset="1" stop-color="#348bfa" stop-opacity="0"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#348bfa" stop-opacity="0"/><stop offset=".5" stop-color="#72c6ff"/><stop offset="1" stop-color="#348bfa" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a5c6f0" stroke-opacity=".04"/></pattern>
    <g id="island">
      <path d="M0 0 120 -54 240 0 120 62Z" fill="#398bc9"/>
      <path d="M0 0 120 62 120 192 77 139 43 118Z" fill="#183958"/>
      <path d="M120 62 240 0 214 100 165 131 120 192Z" fill="#235479"/>
      <path d="M0 0 120 62 240 0 240 15 120 78 0 15Z" fill="#64c8b7"/>
      <path d="M31 -1 120 -42 209 -1 120 45Z" fill="#71c6b1"/>
