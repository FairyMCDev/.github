    <ellipse cx="923" cy="264" rx="238" ry="83" transform="rotate(-18 923 264)" opacity=".24"/>
    <ellipse cx="923" cy="264" rx="275" ry="108" transform="rotate(-18 923 264)" opacity=".1"/>
