  <path d="M64 78H106" stroke="#348bfa" stroke-width="4"/>
  <text x="64" y="125" fill="#8fb7e5" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="3">MINECRAFT · COMMUNITY · CODE</text>
  <text x="60" y="205" fill="#f2f3f7" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="67" letter-spacing="-2">FAIRYLANDS</text>
  <text x="64" y="253" fill="#e1ecfa" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="25" font-weight="600" letter-spacing="6">方块之间，皆是仙境。</text>
  <text x="64" y="300" fill="#969da9" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="16">一起冒险，一起创造，让热爱在这里生长。</text>
