      <path d="M85 -26 120 -8 120 -74 85 -91Z" fill="#d8edfa"/>
      <path d="M120 -8 155 -26 155 -91 120 -74Z" fill="#7ea9ce"/>
      <path d="M85 -91 120 -108 155 -91 120 -74Z" fill="#f0f7ff"/>
      <path d="M108 -80 123 -72 123 -49 108 -57Z" fill="#348bfa"/>
      <path d="M175 -16 189 -23 189 -60 175 -53Z" fill="#315c68"/>
      <path d="M153 -58 183 -106 214 -62 184 -44Z" fill="#58b7a7"/>
      <path d="M153 -58 183 -106 184 -44Z" fill="#89d7bb"/>
    </g>
    <g id="star"><path d="M0 -9 2 -2 9 0 2 2 0 9-2 2-9 0-2-2Z" fill="#b3deff"/></g>
  </defs>
  <rect width="1200" height="460" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="22" fill="url(#grid)"/>
  <ellipse cx="935" cy="215" rx="300" ry="245" fill="url(#halo)"/>
  <g fill="#a9ccff" opacity=".5">
    <circle cx="698" cy="77" r="2"/><circle cx="780" cy="116" r="1.5"/><circle cx="874" cy="49" r="1"/><circle cx="946" cy="67" r="2"/><circle cx="1103" cy="146" r="1.5"/><circle cx="1153" cy="57" r="1"/><circle cx="1064" cy="384" r="2"/><circle cx="811" cy="398" r="1"/><circle cx="1161" cy="267" r="1.5"/><circle cx="720" cy="249" r="1"/><circle cx="987" cy="412" r="1"/><circle cx="656" cy="171" r="1.5"/><circle cx="1047" cy="48" r="1"/><circle cx="1134" cy="351" r="1"/>
  </g>
